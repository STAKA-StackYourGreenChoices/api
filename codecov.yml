# Coverage starts modest and ratchets. A global threshold on a young codebase
# either gets set so low it is meaningless, or blocks unrelated PRs.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%      # don't regress
    patch:
      default:
        target: 60%        # new code carries its weight
comment:
  layout: 'reach, diff, flags, files'
  require_changes: true
