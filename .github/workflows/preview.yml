name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: preview-api-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  deploy:
    name: preview-deploy
    # Skip drafts (unless explicitly labelled) and forks (which get no secrets).
    # NEVER switch this to pull_request_target to work around the fork rule —
    # that runs base-repo workflows with full secrets over untrusted code.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.draft == false ||
       contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}-api.preview.yourdomain.com
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/api:pr-${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/api:buildcache,mode=max
          provenance: false
          build-args: GIT_SHA=${{ github.sha }}

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy preview
        id: deploy
        run: |
          URL=$(ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DEPLOY_HOST }} \
            "preview-up ${{ github.event.pull_request.number }} ${{ steps.vars.outputs.sha }} api" \
            | tail -1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the live preview
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 \
                 -u "preview:${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}" \
                 "${{ steps.deploy.outputs.url }}/health" -o /tmp/health.json; then
              if jq -e '.status == "ok"' /tmp/health.json; then exit 0; fi
            fi
            echo "attempt $i…"; sleep 6
          done
          echo "::error::Preview never became healthy"
          exit 1

      - name: Comment the preview URL on the PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-api
          message: |
            ### 🚀 API preview is live

            | | |
            |---|---|
            | **URL** | ${{ steps.deploy.outputs.url }} |
            | **Docs** | ${{ steps.deploy.outputs.url }}/docs |
            | **Health** | ${{ steps.deploy.outputs.url }}/health |
            | **Commit** | `${{ steps.vars.outputs.sha }}` |
            | **Database** | `pr_${{ github.event.pull_request.number }}` (isolated, seeded) |

            Basic auth: `preview` / _see the team password manager_.
            Torn down automatically when this PR closes.

      - name: Report failure on the PR
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-api
          message: |
            ### ❌ API preview failed to deploy
            [View the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
