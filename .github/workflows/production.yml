name: production

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Short SHA to deploy (for rollback)'
        required: true

concurrency:
  group: deploy-production-api
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gated by the required reviewers configured on the `production` Environment.
    environment:
      name: production
      url: https://api.yourdomain.com
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: |
          SHA="${{ inputs.sha }}"
          if [ -z "$SHA" ]; then SHA="$(git rev-parse --short HEAD)"; fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      # Promote the exact image staging validated — never rebuild for prod.
      # Rebuilding the same commit can still produce different bytes.
      - name: Promote staging image to production tag
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/api:production \
            --tag ghcr.io/${{ github.repository_owner }}/api:${{ github.ref_name }} \
            ghcr.io/${{ github.repository_owner }}/api:${{ steps.vars.outputs.sha }}

      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.DEPLOY_HOST }} \
            "deploy-production api ${{ steps.vars.outputs.sha }}"

      - name: Notify Sentry of the release
        continue-on-error: true
        run: |
          curl -sf https://sentry.io/api/0/organizations/${{ vars.SENTRY_ORG }}/releases/ \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H 'Content-Type: application/json' \
            -d '{"version":"${{ github.ref_name }}","projects":["api"]}'
